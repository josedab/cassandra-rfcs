version: '3.8'

services:
  cassandra1:
    image: cassandra:5.1
    container_name: cassandra1
    hostname: cassandra1
    networks:
      - cassandra-network
    ports:
      - "9042:9042"  # CQL
      - "7199:7199"  # JMX
    environment:
      - CASSANDRA_CLUSTER_NAME=BlogExampleCluster
      - CASSANDRA_DC=DC1
      - CASSANDRA_RACK=RAC1
      - CASSANDRA_ENDPOINT_SNITCH=GossipingPropertyFileSnitch
      - CASSANDRA_NUM_TOKENS=16
      - CASSANDRA_SEEDS=cassandra1
      - MAX_HEAP_SIZE=2G
      - HEAP_NEWSIZE=400M
    volumes:
      - cassandra1-data:/var/lib/cassandra
    healthcheck:
      test: ["CMD", "cqlsh", "-e", "describe keyspaces"]
      interval: 30s
      timeout: 10s
      retries: 10

  cassandra2:
    image: cassandra:5.1
    container_name: cassandra2
    hostname: cassandra2
    networks:
      - cassandra-network
    ports:
      - "9043:9042"
    environment:
      - CASSANDRA_CLUSTER_NAME=BlogExampleCluster
      - CASSANDRA_DC=DC1
      - CASSANDRA_RACK=RAC2
      - CASSANDRA_ENDPOINT_SNITCH=GossipingPropertyFileSnitch
      - CASSANDRA_NUM_TOKENS=16
      - CASSANDRA_SEEDS=cassandra1
      - MAX_HEAP_SIZE=2G
      - HEAP_NEWSIZE=400M
    volumes:
      - cassandra2-data:/var/lib/cassandra
    depends_on:
      cassandra1:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "cqlsh", "-e", "describe keyspaces"]
      interval: 30s
      timeout: 10s
      retries: 10

  cassandra3:
    image: cassandra:5.1
    container_name: cassandra3
    hostname: cassandra3
    networks:
      - cassandra-network
    ports:
      - "9044:9042"
    environment:
      - CASSANDRA_CLUSTER_NAME=BlogExampleCluster
      - CASSANDRA_DC=DC1
      - CASSANDRA_RACK=RAC1
      - CASSANDRA_ENDPOINT_SNITCH=GossipingPropertyFileSnitch
      - CASSANDRA_NUM_TOKENS=16
      - CASSANDRA_SEEDS=cassandra1
      - MAX_HEAP_SIZE=2G
      - HEAP_NEWSIZE=400M
    volumes:
      - cassandra3-data:/var/lib/cassandra
    depends_on:
      cassandra2:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "cqlsh", "-e", "describe keyspaces"]
      interval: 30s
      timeout: 10s
      retries: 10

networks:
  cassandra-network:
    driver: bridge

volumes:
  cassandra1-data:
  cassandra2-data:
  cassandra3-data: